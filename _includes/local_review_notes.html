      pendingDialogPoint = { x: panelRectangle.left, y: panelRectangle.top + Math.min(64, panelRectangle.height / 2) };
      openDialog();
    }
    function selectTarget(event) {
      var target = event.target; var rectangle = target.getBoundingClientRect(); var size = dimensions();
      pendingDialogPoint = { x: event.clientX, y: event.clientY };
      pendingTarget = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), number: nextNoteNumber(), pagePath: pagePath, selector: selectorFor(target), targetLabel: targetLabelFor(target), text: '', createdAt: new Date().toISOString(), offsetX: rectangle.width ? Math.min(1, Math.max(0, (event.clientX - rectangle.left) / rectangle.width)) : 0.5, offsetY: rectangle.height ? Math.min(1, Math.max(0, (event.clientY - rectangle.top) / rectangle.height)) : 0.5, pageX: Math.min(1, Math.max(0, event.pageX / size.width)), pageY: Math.min(1, Math.max(0, event.pageY / size.height)) };
    }
    function captureClick(event) {
      if (!capturing || !(event.target instanceof Element) || event.target.closest('.coin-review-ui')) { return; }
      event.preventDefault(); event.stopPropagation();
      selectTarget(event);
      stopCapture(); openDialog();
    }
    function copyNotes() {
      var copiedNotes = allNotes();
      var summary = '# Coin Shows Near Me review notes\n\n' + (copiedNotes.length ? copiedNotes.map(function (note, index) { return '## Note ' + noteNumber(note, index) + '\n- Page: ' + note.pagePath + '\n- Target: ' + note.targetLabel + '\n- Selector: ' + note.selector + '\n- Timestamp: ' + note.createdAt + (note.updatedAt ? '\n- Updated: ' + note.updatedAt : '') + (note.resolutionState ? '\n- Resolution state: ' + note.resolutionState : '') + '\n\n' + note.text + (note.resolution ? '\n\nResolution: ' + note.resolution : ''); }).join('\n\n') : 'No notes saved.');
      function copied() { setStatus('Notes copied. Paste them into chat when ready.'); }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(summary).then(copied, fallbackCopy); } else { fallbackCopy(); }
      function fallbackCopy() { var textarea = document.createElement('textarea'); textarea.value = summary; textarea.setAttribute('readonly', ''); textarea.style.position = 'fixed'; textarea.style.opacity = '0'; document.body.append(textarea); textarea.select(); try { document.execCommand('copy'); copied(); } catch (error) { setStatus('Copy was unavailable. Select notes manually.', true); } textarea.remove(); }
    }
    loadNotes(); renderNotes(); focusNoteFromLocation(); setStatus('Ready. Select Add a note to begin.');
    trigger.addEventListener('click', function () { if (panel.hidden) { openPanel(); } else { closePanel(); } });
    closeButton.addEventListener('click', closePanel); addButton.addEventListener('click', startCapture);
    refreshButton.addEventListener('click', function () { loadNotes(); renderNotes(); setStatus(notes.length + ' saved local note' + (notes.length === 1 ? '' : 's') + ' loaded.'); });
    copyButton.addEventListener('click', copyNotes);
    clearButton.addEventListener('click', function () { if (notes.length && window.confirm('Clear all local review notes?')) { notes = []; saveNotes(); renderNotes(); setStatus('All notes cleared.'); } });
    cancelButton.addEventListener('click', function () { clearDialogState(); dialog.close?.(); });
    dialog.addEventListener('cancel', clearDialogState);
    dialogForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!noteField.reportValidity()) { return; }
      var text = noteField.value.trim();
      if (!text) { return; }
      if (editingNote) {
        var index = notes.indexOf(editingNote);
        var updatedAt = new Date().toISOString();
        if (index < 0 || !validTimestamp(updatedAt)) { setStatus('This note could not be updated.', true); return; }
        var originalNote = notes[index];
        notes[index] = Object.assign({}, originalNote, { text: text, updatedAt: updatedAt });
        if (!saveNotes()) { notes[index] = originalNote; setStatus('This browser could not save the note.', true); return; }
        clearDialogState(); dialog.close?.(); renderNotes(); openPanel(); setStatus('Note updated only in this browser.');
        return;
      }
      if (!pendingTarget) { return; }
      if (notes.length >= 100) { setStatus('The 100-note local limit is reached. Delete a note before adding another.', true); dialog.close?.(); openPanel(); return; }
      pendingTarget.text = text;
      notes.push(pendingTarget);
      if (!saveNotes()) { notes.pop(); setStatus('This browser could not save the note.', true); openPanel(); return; }
      clearDialogState(); dialog.close?.(); renderNotes(); openPanel(); setStatus('Note saved only in this browser.');
    });
    document.addEventListener('click', captureClick, true);
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && capturing) { stopCapture(); openPanel(); setStatus('Note selection cancelled.'); } });
    window.addEventListener('storage', function (event) { if (event.key === storageKey) { loadNotes(); renderNotes(); setStatus('Notes refreshed from this browser.'); } });
    window.addEventListener('resize', function () { renderPins(); positionDialog(); });
  });
</script>
