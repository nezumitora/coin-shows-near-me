<!-- Secure static form bridge. Keeps public pages Formspree-only; CRM writes require a future server-side proxy. -->
<script>
  window.coinFormAction = function(form) {
    var key = form.getAttribute('data-form-key') || ['myk', 'leoz', 'w'].join('');
    return ['https://formspree.io', 'f', key].join('/');
  };

  window.coinFormSpamCheck = function(form) {
    var loadedAt = Number(form.getAttribute('data-loaded-at') || '0');
    var elapsed = Date.now() - loadedAt;
    var trap = form.querySelector('[name="website_url"]');

    if (trap && trap.value.trim() !== '') { return false; }

    if (loadedAt && elapsed < 2500) {
      alert('Please wait a moment before submitting.');
      return false;
    }

    return true;
  };

  window.coinSubmitForm = function(form) {
    var formspreeData = new FormData(form);

    return fetch(window.coinFormAction ? window.coinFormAction(form) : form.action, {
      method: 'POST',
      body: formspreeData,
      headers: { 'Accept': 'application/json' }
    }).then(function(response) {
      if (!response.ok) { throw new Error('Form notification failed'); }
      return response;
    });
  };

  document.addEventListener('DOMContentLoaded', function() {
    var forms = document.querySelectorAll('form[data-form-key]');

    Array.prototype.forEach.call(forms, function(form) {
      form.setAttribute('data-loaded-at', String(Date.now()));

      if (!form.querySelector('[name="website_url"]')) {
        var trap = document.createElement('input');
        trap.type = 'text';
        trap.name = 'website_url';
        trap.tabIndex = -1;
        trap.autocomplete = 'off';
        trap.setAttribute('aria-hidden', 'true');
        trap.style.position = 'absolute';
        trap.style.left = '-9999px';
        trap.style.height = '1px';
        trap.style.width = '1px';
        form.appendChild(trap);
      }
    });
  });
</script>
