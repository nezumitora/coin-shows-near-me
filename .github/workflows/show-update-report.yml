name: Show Update Report

on:
  schedule:
    # Daily 8:25 AM UTC. Review-only: does not commit or publish.
    - cron: '25 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate review-only show update report
        env:
          MAX_URL_CHECKS: '0'
          REQUEST_DELAY_SECONDS: '0.5'
        run: ruby _scripts/show-update-report.rb

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: show-update-report
          path: |
            tmp/show-update-report.md
            tmp/show-source-inventory.csv
            tmp/show-url-checks.csv
            tmp/show-verification-queue.csv
          if-no-files-found: error
