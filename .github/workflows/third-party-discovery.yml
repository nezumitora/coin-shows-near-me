name: Third-Party Discovery

on:
  schedule:
    # Daily 9:40 AM UTC. Report-only: does not commit, publish, email, text, or submit forms.
    - cron: '40 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate third-party discovery report
        env:
          # CoinZip robots.txt requests Crawl-delay: 10. Keep the report slow
          # and review-only so we do not hammer third-party directories.
          REQUEST_DELAY_SECONDS: '10.0'
        run: ruby _scripts/third-party-discovery-report.rb

      - name: Upload discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: third-party-discovery
          path: |
            tmp/third-party-discovery-report.md
            tmp/third-party-discovery-report.csv
            tmp/third-party-lead-details.csv
          if-no-files-found: error
