# Bounded Phase 2 profile stacked on the review-only listing freshness MVP.
#
# Source URLs and source types remain authoritative in external-sources.yml.
# This profile selects a small reviewed batch and records how each source must
# be checked. It cannot edit listings, publish pages, or activate a schedule.

version: 2
mode: report_only
automatic_action: none
minimum_sources: 10
maximum_sources: 20

policies:
  check_methods:
    generic_text_name_and_date_proximity_v1:
      behavior: Strip scripts, styles, and HTML; find configured show names and nearby explicit date strings.
      max_name_date_distance: 160
      max_date_candidates: 25
      recurrence_inference: false
      cancellation_inference: false
  cadence_policies:
    event_relative_inactive_v1:
      within_30_days: every_2_to_3_days
      days_31_to_90: weekly
      over_90_days: monthly
      past: weekly_stale_queue
      tbd_or_partial: monthly_unconfirmed_queue
      activation: inactive
  constraints:
    approved_public_report_only_v1:
      public_event_facts_only: true
      copy_page_content: false
      robots_txt: honor_and_stop_if_disallowed
      terms: honor_and_stop_if_prohibited
      robots_terms_review_before_activation: required
      request_delay_seconds: 1.0
      max_requests_per_source_per_run: 1
      credentials: forbidden
      forms_and_outreach: forbidden
  redirects:
    record_and_stop_v1:
      follow_redirects: false
      record_location_header: true
      final_url_requires_manual_reapproval: true
  fail_closed:
    source_evidence_only_v1:
      non_2xx: source_availability_review
      blocked_or_rate_limited: source_availability_review
      missing_name_or_date: insufficient_evidence
      multiple_dates: manual_event_association
      source_failure_is_cancellation: false
      automatic_action: none

sources:
  - source_key: pacific-expos-north-county
    covered_show_ids:
      - north-county-monthly-coin-show
    source_tier: tier_1_primary
    authority_basis: Exact official organizer date page already recorded on the canonical listing.
    check_method: generic_text_name_and_date_proximity_v1
    page_shape: single_event_multiple_dates
    expected_cadence: event_relative_inactive_v1
    constraints_policy: approved_public_report_only_v1
    redirect_policy: record_and_stop_v1
    fail_closed_policy: source_evidence_only_v1
    expectations:
      north-county-monthly-coin-show: current_match

