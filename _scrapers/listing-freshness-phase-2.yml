# These fixtures are synthetic safety checks. They use reserved .invalid URLs,
# never enter the canonical listing queue, and never authorize a listing edit.
controlled_cases:
  - case_id: controlled-confirmed-date-change
    case_kind: source_fact
    scenario: confirmed_date_change
    expected_outcome: candidate_change
  - case_id: controlled-redirect
    case_kind: source_fact
    scenario: redirect
    expected_outcome: source_unavailable
  - case_id: controlled-duplicate
    case_kind: duplicate
    scenario: duplicate
    expected_outcome: duplicate_candidate
  - case_id: controlled-partial-date
    case_kind: listing_classification
    scenario: partial_date
    expected_outcome: partial_date_review
  - case_id: controlled-cancellation-evidence
    case_kind: source_fact
    scenario: cancellation_evidence
    expected_outcome: cancellation_evidence
  - case_id: controlled-source-failure
    case_kind: source_fact
    scenario: source_failure
    expected_outcome: source_unavailable
