title: "Coin Shows Near Me"
description: "Find coin shows near you in a growing nationwide directory with dates, venues, organizer details, and verification context."
url: "https://coinshownearme.com"
baseurl: ""

logo: "/assets/images/coinshows-buffalo-transparent-960w-v1.webp"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown

search_enabled: false
nav_enabled: true

# SEO
lang: en-US
tagline: "Find upcoming coin shows in your area"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/logo.png"
        width: 1254
        height: 1254
        alt: "Coin Shows Near Me buffalo logo"

# just-the-docs nav
nav_sort: order
nav_external_links: []

aux_links: {}
aux_links_new_tab: false

google_site_verification: ZW60JDUpZFD9rhZv8KgiklQ65RSr5jyyxku3686lHbo

# Exclude build artifacts
exclude:
  - _scripts/
  - _scrapers/
  - Gemfile
  - Gemfile.lock
  - DESIGN.md
  - SESSION-STATE.md
  - docs/
  - TODO.md
  - CHANGELOG.md
  - LICENSE
  - AGENTS.md
  - inbox/
  - prompts/
  - todo/
